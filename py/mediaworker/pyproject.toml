[project]
name = "mediaworker"
version = "0.0.0"
description = "Image processing and tone-curve selection for the QU ACM Media Library worker. Called by apps/worker via spawn; prints JSON on stdout."
requires-python = ">=3.12"  # production: /opt/alt/python313
dependencies = ["pillow>=11", "pillow-heif>=1.0", "numpy>=2"]

[project.optional-dependencies]
# Automatic tone-curve selection. Installed by deploy/setup-worker-venv.sh --with-tonemap from the CPU-only
# PyTorch index, into the worker's own venv.
tonemap = ["torch", "torchvision", "pyiqa"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mediaworker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "ffmpeg: needs ffmpeg with zscale, lut3d and tonemap",
  "tonemap: needs torch and pyiqa (the real DISTS/TOPIQ scorer)",
  "validation: the gate's reviewed clips (set TONEMAP_CLIPS); run with -m validation",
]
addopts = "-m 'not validation'"
tmp_path_retention_policy = "failed"
